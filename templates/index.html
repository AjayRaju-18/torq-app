<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORQ - Mechanical Engineering Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #343541;
            color: #ececf1;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #202123;
            display: flex;
            flex-direction: column;
            padding: 8px;
        }

        .new-chat-btn {
            background: transparent;
            border: 1px solid #565869;
            color: #ececf1;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover {
            background: #2a2b32;
        }

        .conversations {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 8px;
        }

        .conversation-item {
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 4px;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conversation-item:hover {
            background: #2a2b32;
        }

        .conversation-item.active {
            background: #343541;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #8e8ea0;
            cursor: pointer;
            padding: 4px;
            font-size: 16px;
        }

        .delete-btn:hover {
            color: #ececf1;
        }

        .upload-section {
            border-top: 1px solid #565869;
            padding-top: 8px;
        }

        .upload-btn {
            background: #10a37f;
            border: none;
            color: white;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            margin-top: 8px;
        }

        .upload-btn:hover {
            background: #0d8c6d;
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: #343541;
            padding: 16px;
            border-bottom: 1px solid #565869;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .rag-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #565869;
            transition: 0.4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #10a37f;
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 8px;
        }

        .message.user {
            background: #343541;
            margin-left: 20%;
        }

        .message.assistant {
            background: #444654;
        }

        .message-role {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
            color: #10a37f;
        }

        .message-content {
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #565869;
            font-size: 12px;
            color: #8e8ea0;
        }

        .input-area {
            padding: 20px;
            background: #343541;
            border-top: 1px solid #565869;
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        #messageInput {
            width: 100%;
            padding: 12px 50px 12px 16px;
            background: #40414f;
            border: 1px solid #565869;
            border-radius: 8px;
            color: #ececf1;
            font-size: 16px;
            resize: none;
            font-family: inherit;
        }

        #messageInput:focus {
            outline: none;
            border-color: #10a37f;
        }

        #sendBtn {
            position: absolute;
            right: 8px;
            bottom: 8px;
            background: #10a37f;
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
        }

        #sendBtn:hover {
            background: #0d8c6d;
        }

        #sendBtn:disabled {
            background: #565869;
            cursor: not-allowed;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10a37f;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }

        .empty-state h2 {
            font-size: 32px;
            margin-bottom: 16px;
        }

        .empty-state p {
            color: #8e8ea0;
            font-size: 16px;
        }

        #fileInput {
            display: none;
        }

        .upload-status {
            margin-top: 8px;
            font-size: 12px;
            color: #8e8ea0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <button class="new-chat-btn" onclick="newConversation()">
                <span>+</span> New Chat
            </button>
            
            <div class="conversations" id="conversationsList"></div>
            
            <div class="upload-section">
                <input type="file" id="fileInput" accept=".pdf" onchange="uploadPDF()">
                <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                    📄 Upload PDF
                </button>
                <div class="upload-status" id="uploadStatus"></div>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main-content">
            <div class="chat-header">
                <h1>TORQ - Mechanical Engineering Assistant</h1>
                <div class="rag-toggle">
                    <span>RAG Mode</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="ragToggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="messages" id="messages">
                <div class="empty-state">
                    <h2>Welcome to TORQ</h2>
                    <p>Your specialized mechanical engineering assistant</p>
                    <p style="margin-top: 20px;">Upload PDFs to train the model or start chatting!</p>
                </div>
            </div>

            <div class="input-area">
                <div class="input-container">
                    <textarea 
                        id="messageInput" 
                        placeholder="Ask me anything about mechanical engineering..."
                        rows="1"
                        onkeydown="handleKeyPress(event)"
                    ></textarea>
                    <button id="sendBtn" onclick="sendMessage()">➤</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentConversationId = null;

        // Load conversations on page load
        loadConversations();

        function loadConversations() {
            fetch('/conversations')
                .then(res => res.json())
                .then(conversations => {
                    const list = document.getElementById('conversationsList');
                    list.innerHTML = '';
                    
                    conversations.forEach(conv => {
                        const item = document.createElement('div');
                        item.className = 'conversation-item' + (conv.id === currentConversationId ? ' active' : '');
                        item.innerHTML = `
                            <span onclick="loadConversation('${conv.id}')">${conv.title}</span>
                            <button class="delete-btn" onclick="deleteConversation('${conv.id}', event)">×</button>
                        `;
                        list.appendChild(item);
                    });
                });
        }

        function loadConversation(conversationId) {
            fetch(`/conversation/${conversationId}`)
                .then(res => res.json())
                .then(conversation => {
                    currentConversationId = conversationId;
                    const messagesDiv = document.getElementById('messages');
                    messagesDiv.innerHTML = '';
                    
                    conversation.messages.forEach(msg => {
                        addMessageToUI(msg.role, msg.content, msg.sources);
                    });
                    
                    loadConversations();
                    scrollToBottom();
                });
        }

        function deleteConversation(conversationId, event) {
            event.stopPropagation();
            if (confirm('Delete this conversation?')) {
                fetch(`/conversation/${conversationId}`, { method: 'DELETE' })
                    .then(() => {
                        if (currentConversationId === conversationId) {
                            currentConversationId = null;
                            document.getElementById('messages').innerHTML = `
                                <div class="empty-state">
                                    <h2>Welcome to TORQ</h2>
                                    <p>Your specialized mechanical engineering assistant</p>
                                </div>
                            `;
                        }
                        loadConversations();
                    });
            }
        }

        function newConversation() {
            currentConversationId = null;
            document.getElementById('messages').innerHTML = `
                <div class="empty-state">
                    <h2>Welcome to TORQ</h2>
                    <p>Your specialized mechanical engineering assistant</p>
                </div>
            `;
            loadConversations();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            // Clear empty state if present
            const messagesDiv = document.getElementById('messages');
            if (messagesDiv.querySelector('.empty-state')) {
                messagesDiv.innerHTML = '';
            }
            
            // Add user message
            addMessageToUI('user', message);
            input.value = '';
            
            // Add loading indicator
            const loadingMsg = addMessageToUI('assistant', '');
            loadingMsg.innerHTML = '<div class="message-role">TORQ</div><div class="message-content"><span class="loading"></span></div>';
            
            // Send to backend
            const useRag = document.getElementById('ragToggle').checked;
            
            fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    conversation_id: currentConversationId,
                    use_rag: useRag
                })
            })
            .then(res => res.json())
            .then(data => {
                loadingMsg.remove();
                
                if (data.error) {
                    addMessageToUI('assistant', 'Error: ' + data.error);
                } else {
                    currentConversationId = data.conversation_id;
                    addMessageToUI('assistant', data.response, data.sources);
                    loadConversations();
                }
                
                sendBtn.disabled = false;
                scrollToBottom();
            })
            .catch(error => {
                loadingMsg.remove();
                addMessageToUI('assistant', 'Error: ' + error.message);
                sendBtn.disabled = false;
            });
        }

        function addMessageToUI(role, content, sources = []) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            let html = `
                <div class="message-role">${role === 'user' ? 'You' : 'TORQ'}</div>
                <div class="message-content">${content}</div>
            `;
            
            if (sources && sources.length > 0) {
                html += `<div class="sources">📚 Sources: ${sources.join(', ')}</div>`;
            }
            
            messageDiv.innerHTML = html;
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
            
            return messageDiv;
        }

        function scrollToBottom() {
            const messagesDiv = document.getElementById('messages');
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function uploadPDF() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) return;
            
            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.textContent = 'Uploading...';
            
            const formData = new FormData();
            formData.append('file', file);
            
            fetch('/upload_pdf', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) {
                    statusDiv.textContent = 'Error: ' + data.error;
                } else {
                    statusDiv.textContent = `✓ ${data.message}`;
                    setTimeout(() => statusDiv.textContent = '', 3000);
                }
                fileInput.value = '';
            })
            .catch(error => {
                statusDiv.textContent = 'Error: ' + error.message;
                fileInput.value = '';
            });
        }
    </script>
</body>
</html>
